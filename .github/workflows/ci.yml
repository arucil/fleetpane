name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -p '*_test.py'
      - if: runner.os != 'Windows'
        run: cargo build -p fleetpane-host --locked
      - name: Device appearance persistence
        if: runner.os != 'Windows'
        run: python3 scripts/appearance-smoke.py
      - name: Local alert policy persistence
        if: runner.os != 'Windows'
        run: python3 scripts/notification-policy-smoke.py
      - name: Preferred Host persistence
        if: runner.os != 'Windows'
        run: python3 scripts/host-choice-smoke.py
      - name: ACP activity chronology
        if: runner.os != 'Windows'
        run: python3 scripts/acp-order-smoke.py
      - name: ACP idle session metadata
        if: runner.os != 'Windows'
        run: python3 scripts/acp-info-smoke.py
      - name: ACP v1 session modes
        if: runner.os != 'Windows'
        run: python3 scripts/acp-modes-smoke.py
      - name: ACP tool call snapshots
        if: runner.os != 'Windows'
        run: python3 scripts/acp-tools-smoke.py
      - name: Supplied ACP and MCP resources
        if: runner.os != 'Windows'
        run: python3 scripts/resources-smoke.py
      - name: ACP permission cancellation
        if: runner.os != 'Windows'
        run: python3 scripts/acp-cancel-smoke.py
      - name: Stop acknowledgement and exact-turn completion
        if: runner.os != 'Windows'
        run: python3 scripts/stop-progress-smoke.py
      - name: Terminal turn results and local reviews
        if: runner.os != 'Windows'
        run: python3 scripts/completion-smoke.py
      - name: Durable completion reminder claims
        if: runner.os != 'Windows'
        run: python3 scripts/completion-alert-smoke.py
      - name: Durable pending request reminder claims
        if: runner.os != 'Windows'
        run: python3 scripts/pending-alert-smoke.py
      - name: ACP permission review
        if: runner.os != 'Windows'
        run: python3 scripts/acp-review-smoke.py
      - name: Recent workspace directories
        if: runner.os != 'Windows'
        run: python3 scripts/recent-directories-smoke.py
      - name: Offline Paseo workspace and history migration
        if: runner.os != 'Windows'
        run: python3 scripts/paseo-import-smoke.py
      - name: Bulk Paseo workspace and history migration
        if: runner.os != 'Windows'
        run: python3 scripts/paseo-batch-smoke.py
      - name: Interrupted Paseo migration receipts and retry
        if: runner.os != 'Windows'
        run: python3 scripts/paseo-receipts-smoke.py
      - name: Abandoned Paseo copy collection
        if: runner.os != 'Windows'
        run: python3 scripts/paseo-scratch-smoke.py
      - name: Cooperative Paseo CLI signal stop
        if: runner.os != 'Windows'
        run: python3 scripts/paseo-signals-smoke.py
      - name: DeepSeek v4 offline history migration
        if: runner.os != 'Windows'
        run: python3 scripts/paseo-dsh-v4-smoke.py
      - name: Independent Paseo Codex history fork
        if: runner.os != 'Windows'
        run: python3 scripts/paseo-fork-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/runtime-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/session-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/directory-smoke.py
      - name: Cross-Host observational session directory
        if: runner.os != 'Windows'
        run: python3 scripts/fleet-directory-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/models-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/history-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/query-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/acp-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/acp-history-smoke.py
      - name: ACP archive crash and storage boundaries
        if: runner.os != 'Windows'
        run: python3 scripts/acp-archive-smoke.py
      - name: ACP admission and explicit stop reasons
        if: runner.os != 'Windows'
        run: python3 scripts/acp-stop-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/concurrency-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/multihost-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/journal-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/drain-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/routing-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/creations-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/drafts-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/images-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/steering-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/tasks-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/workspaces-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/workspace-pins-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/files-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/file-images-smoke.py
      - if: runner.os == 'Linux'
        run: python3 scripts/terminal-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/diffs-smoke.py
      - if: runner.os != 'Windows'
        run: python3 scripts/worktrees-smoke.py

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-x11-dev libwayland-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path apps/desktop/Cargo.toml --locked
      - run: cargo build --manifest-path apps/desktop/Cargo.toml --locked
