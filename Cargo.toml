[workspace]
resolver = "3"
members = ["crates/protocol", "crates/client", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/arucil/fleetpane"

[workspace.dependencies]
fleetpane-protocol = { path = "crates/protocol" }
fleetpane-client = { path = "crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
